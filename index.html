<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Scores</title>
<meta name="description" content="Live football scores and tables — Champions League and Ligue 1.">
<meta name="theme-color" content="#15171d">

<!-- Link preview, for when the URL is pasted into a chat. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Sport Scores">
<meta property="og:description" content="Live scores, goalscorers and league tables — Champions League and Ligue 1.">
<meta name="twitter:card" content="summary">

<!-- Same football as the header, with heavier strokes so the panels still read
     at 16px. Hashes are %23-encoded because it lives in a data URI. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10.6' fill='%23ffffff' stroke='%2315171d' stroke-width='1.1'/><g stroke='%2315171d' stroke-width='1.15'><line x1='12.0' y1='9.2' x2='12.0' y2='1.65'/><line x1='14.66' y1='11.13' x2='21.84' y2='8.78'/><line x1='13.65' y1='14.27' x2='18.09' y2='20.37'/><line x1='10.35' y1='14.27' x2='5.91' y2='20.37'/><line x1='9.34' y1='11.13' x2='2.16' y2='8.78'/></g><g fill='%2315171d'><polygon points='12.0,9.2 14.66,11.13 13.65,14.27 10.35,14.27 9.34,11.13'/><polygon points='17.94,3.83 18.77,6.4 16.58,7.99 14.4,6.4 15.23,3.83'/><polygon points='21.61,15.12 19.42,16.71 17.23,15.12 18.07,12.55 20.77,12.55'/><polygon points='12.0,22.1 9.81,20.51 10.65,17.94 13.35,17.94 14.19,20.51'/><polygon points='2.39,15.12 3.23,12.55 5.93,12.55 6.77,15.12 4.58,16.71'/><polygon points='6.06,3.83 8.77,3.83 9.6,6.4 7.42,7.99 5.23,6.4'/></g></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <!-- Football: a truncated icosahedron — 12 pentagons, 20 hexagons — rotated
         so a pentagon faces the viewer, tilted 12/-8 degrees so it does not read
         flat-on, orthographically projected with the far side culled (16 of the
         32 faces survive), then shaded as a sphere. The geometry is computed
         rather than hand-drawn. The favicon keeps a simplified flat ball: this
         much detail turns to mush at 16px. -->
      <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Football">
        <defs>
          <radialGradient id="ball-light" cx="34%" cy="28%" r="78%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#c9ccd2"/>
          </radialGradient>
          <radialGradient id="ball-dark" cx="34%" cy="28%" r="78%">
            <stop offset="0" stop-color="#3c4048"/>
            <stop offset="1" stop-color="#14161b"/>
          </radialGradient>
          <radialGradient id="ball-shade" cx="34%" cy="28%" r="72%">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
          </radialGradient>
          <clipPath id="ball-clip">
            <circle cx="50" cy="50" r="47.0"/>
          </clipPath>
        </defs>
        <circle cx="50" cy="50" r="47.0" fill="#eceef1"/>
        <g clip-path="url(#ball-clip)" stroke="#14161b" stroke-width="1.8" stroke-linejoin="round">
          <polygon points="81.98,21.27 90.21,25.8 82.93,19.43 67.41,8.53 59.18,3.99 66.46,10.36" fill="url(#ball-light)"/>
          <polygon points="85.98,78.73 89.35,74.2 77.85,80.57 62.98,91.47 59.6,96.01 71.1,89.64" fill="url(#ball-light)"/>
          <polygon points="15.25,66.86 6.83,52.02 3.46,56.55 5.37,43.45 9.79,74.2 17.07,80.57" fill="url(#ball-light)"/>
          <polygon points="59.6,96.01 62.98,91.47 46.28,88.67 32.59,91.47 40.82,96.01" fill="url(#ball-dark)"/>
          <polygon points="17.07,80.57 15.25,66.86 6.83,52.02 3.46,56.55 9.79,74.2" fill="url(#ball-dark)"/>
          <polygon points="86.4,52.02 76.03,66.86 77.85,80.57 89.35,74.2 94.63,56.55 96.54,43.45" fill="url(#ball-light)"/>
          <polygon points="59.6,96.01 62.98,91.47 46.28,88.67 44.46,74.96 32.59,91.47 40.82,96.01" fill="url(#ball-light)"/>
          <polygon points="89.35,74.2 94.63,56.55 86.4,52.02 76.03,66.86 77.85,80.57" fill="url(#ball-dark)"/>
          <polygon points="25.81,31.57 36.18,16.73 28.9,10.36 14.02,21.27 12.12,34.37" fill="url(#ball-dark)"/>
          <polygon points="36.18,16.73 54.96,16.73 28.9,10.36 14.02,21.27 12.12,34.37 25.81,31.57" fill="url(#ball-light)"/>
          <polygon points="80.07,34.37 81.98,21.27 66.46,10.36 54.96,16.73 63.37,31.57" fill="url(#ball-dark)"/>
          <polygon points="63.37,31.57 80.07,34.37 81.98,21.27 66.46,10.36 54.96,16.73 36.18,16.73" fill="url(#ball-light)"/>
          <polygon points="28.94,64.05 34.22,46.41 25.81,31.57 12.12,34.37 6.83,52.02 15.25,66.86" fill="url(#ball-light)"/>
          <polygon points="76.03,66.86 86.4,52.02 80.07,34.37 63.37,31.57 53.0,46.41 59.33,64.05" fill="url(#ball-light)"/>
          <polygon points="59.33,64.05 53.0,46.41 34.22,46.41 28.94,64.05 44.46,74.96 46.28,88.67" fill="url(#ball-light)"/>
          <polygon points="59.33,64.05 53.0,46.41 34.22,46.41 28.94,64.05 44.46,74.96" fill="url(#ball-dark)"/>
        </g>
        <circle cx="50" cy="50" r="47.0" fill="url(#ball-shade)"/>
        <circle cx="50" cy="50" r="47.0" fill="none" stroke="#14161b" stroke-width="1.8" stroke-opacity="0.55"/>
      </svg>
    <div class="brand-text">
      <h1>Sport Scores</h1>
      <p id="season-line" class="muted">Loading…</p>
    </div>
  </div>

  <div class="topbar-right">
    <span id="live-badge" class="live-badge" hidden><i class="pulse"></i><span id="live-count">0</span> live</span>
    <button id="refresh-btn" class="icon-btn" title="Refresh now" aria-label="Refresh now">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- Competition switcher, rendered from the COMPETITIONS list in app.js -->
<nav class="comps" id="comps" aria-label="Competition"></nav>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-view="matches" role="tab" aria-selected="true">Matches</button>
  <button class="tab" data-view="standings" role="tab" aria-selected="false">Table</button>
</nav>

<!-- ── Matches ───────────────────────────────────────────── -->
<main id="view-matches" class="view">
  <div class="datebar">
    <button id="prev-day" class="nav-btn" aria-label="Previous matchday">‹</button>
    <div class="datebar-center">
      <strong id="date-label">—</strong>
      <span id="date-sub" class="muted"></span>
    </div>
    <button id="next-day" class="nav-btn" aria-label="Next matchday">›</button>
    <button id="today-btn" class="ghost-btn">Today</button>
  </div>

  <div id="matchday-strip" class="md-strip" hidden></div>
  <div id="matches" class="matches"></div>
</main>

<!-- ── Table ─────────────────────────────────────────────── -->
<main id="view-standings" class="view" hidden>
  <div id="standings-wrap" class="table-wrap"></div>
  <ul id="legend" class="legend"></ul>
</main>

<footer class="foot">
  <span id="updated" class="muted">—</span>
  <span class="muted">Data: ESPN public API · auto-refreshes while matches are live</span>
</footer>

<script src="app.js"></script>
</body>
</html>
